<!doctype html>
<html lang="en">
<head>
    <!-- meta tags, links to css, etc. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generative Design</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <!-- [AI-Assisted: Copilot SDK in VS Code | 2026-10-21] -->
    <!-- Intent: Provide weekly navigation, clickable daily summaries, and selected-day details. -->
    <main class="container py-4">
        <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <button id="previous-week" class="btn forecast-navigation" type="button">
                Previous week
            </button>
            <!-- [AI-Assisted: Copilot SDK in VS Code | 2026-10-21] -->
            <!-- Intent: Show the location, selected day's high/low, and month message in white text. -->
            <div class="text-center text-white flex-grow-1">
                <h1 id="week-label" class="h2 mb-1">My Location</h1>
                <p id="location-summary" class="mb-0"></p>
                <p id="seasonal-message" class="mb-0"></p>
            </div>
            <button id="next-week" class="btn forecast-navigation" type="button">
                Next week
            </button>
        </header>

        <section class="mb-4" aria-labelledby="weekly-heading">
            <h2 id="weekly-heading" class="visually-hidden">Weekly forecast</h2>
            <div id="weekly-forecast" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3"></div>
        </section>

        <section class="card forecast-details shadow-sm" aria-labelledby="day">
            <div class="card-header forecast-details__header">
                <h2 id="day" class="h4 card-title mb-0"></h2>
            </div>
            <div class="card-body">
                <!-- [AI-Assisted: Copilot SDK in VS Code | 2026-10-21] -->
                <!-- Intent: Make hourly forecast cards horizontally scrollable by touch, mouse, and keyboard. -->
                <div class="hourly-forecast-scroll" role="region" aria-label="Hourly forecast; scroll horizontally to see more hours" tabindex="0">
                    <ol id="hourbyhour" class="d-flex flex-nowrap gap-2 list-unstyled mb-0"></ol>
                </div>
            </div>
        </section>
    </main>

    <!-- Load JavaScript after the page elements render. -->
    <script src="assets/js/main.js"></script>
</body>
</html>
